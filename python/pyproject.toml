[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solax-price-planner"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.100,<0.120", "pydantic>=1.10.21,<2", "httpx>=0.27,<0.29", "uvicorn>=0.30,<0.35", "rocketry==2.5.1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.package-data]
solax_optimizer = ["static/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["solax_optimizer*"]
