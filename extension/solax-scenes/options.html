<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>gordpool → SolaX: настройки</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #1d2433; }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; margin-top: 24px; }
    label { display: grid; grid-template-columns: 260px 1fr; gap: 8px; align-items: center; margin: 6px 0; }
    input { padding: 6px 8px; border: 1px solid #c4cad6; border-radius: 6px; font: inherit; }
    small { color: #5b6475; }
    button { padding: 8px 16px; border-radius: 6px; border: 0; background: #1f6feb; color: #fff; font: inherit; cursor: pointer; }
    #status { margin-left: 12px; }
  </style>
</head>
<body>
  <h1>gordpool → SolaX Smart Scene</h1>
  <form id="form">
    <h2>API</h2>
    <label>Адрес gordpool API <input name="apiBase" type="url" required></label>
    <small>Например https://gordpool-xxxx.run.app или http://localhost:8080. При сохранении Chrome попросит доступ к этому адресу.</small>

    <h2>Рынок и объект</h2>
    <label>Зона Nordpool <input name="area"></label>
    <label>Часовой пояс объекта <input name="timezone"></label>
    <label>Инверторов за DataHub <input name="inverters" type="number" min="1"></label>
    <label>Пропускать окна слабее, кВт <input name="min_power_kw" type="number" step="0.1" min="0"></label>

    <h2>Батарея</h2>
    <label>Ёмкость, кВт·ч <input name="capacity_kwh" type="number" step="0.1" min="0"></label>
    <label>Текущий SOC, % <input name="initial_soc_percent" type="number" step="1" min="0" max="100"></label>
    <label>Мин. SOC, % <input name="min_soc_percent" type="number" step="1" min="0" max="100"></label>
    <label>Макс. SOC, % <input name="max_soc_percent" type="number" step="1" min="0" max="100"></label>
    <label>Макс. мощность заряда, кВт <input name="max_charge_kw" type="number" step="0.1" min="0" placeholder="0.5C"></label>
    <label>Макс. мощность разряда, кВт <input name="max_discharge_kw" type="number" step="0.1" min="0" placeholder="0.5C"></label>
    <label>КПД цикла (0–1) <input name="round_trip_efficiency" type="number" step="0.01" min="0" max="1" placeholder="0.9"></label>
    <label>Износ, центов за кВт·ч разряда <input name="degradation_cost_cents" type="number" step="0.1" min="0"></label>
    <label>Макс. циклов в сутки <input name="max_cycles_per_day" type="number" step="0.1" min="0"></label>

    <p><button type="submit">Сохранить</button><span id="status"></span></p>
  </form>
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
