name: Python planner

on:
  pull_request:
    paths: ['python/**', '.github/workflows/python.yml']
  push:
    paths: ['python/**', '.github/workflows/python.yml']
  workflow_dispatch:
    inputs:
      live_e2e:
        description: Fetch real Nord Pool LV prices and verify the API pipeline
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Chromium report tests with real Uvicorn
        run: python -m unittest tests.browser.test_report -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: python/state/browser/
          if-no-files-found: ignore
  live-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.live_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Real Nord Pool to snapshot to API plan
        env:
          GORDPOOL_LIVE_E2E: '1'
        run: python -m unittest tests.test_e2e.PricePipelineTests.test_live_nordpool_snapshot_restart_and_plan -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nordpool-live-e2e
          path: python/state/e2e-live.json
          if-no-files-found: warn
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install declared dependencies
        run: python -m pip install -e '.[test]'
      - name: Check dependency compatibility
        run: |
          python -m pip check
          python -c 'import rocketry; import pydantic; assert pydantic.VERSION.startswith("1.")'
      - name: Test with branch coverage
        run: python -m pytest --cov=solax_optimizer --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Offline replay
        run: python -m solax_optimizer examples/request.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: python/coverage.xml
          if-no-files-found: ignore
